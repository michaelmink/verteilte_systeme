syntax = "proto3";

import "google/protobuf/empty.proto";

option java_package = "java_grpc.proto";
option java_multiple_files = true;

service MyServices {
  rpc SayHello (google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc Add (AddInput) returns (AddOutput);
}

message AddInput { 
  double a = 1; 
  double b = 2;
  }

message AddOutput   { 
  double c = 1; 
  }
