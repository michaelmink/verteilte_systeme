LoadModule ldap_module modules/mod_ldap.so
LoadModule authnz_ldap_module modules/mod_authnz_ldap.so

<Location "/">
    AuthType Basic
    AuthName "LDAP Testlab"
    AuthBasicProvider ldap
    AuthLDAPURL "ldap://openldap:389/dc=testlab,dc=local?uid?sub?(objectClass=posixAccount)"
    AuthLDAPBindDN "cn=admin,dc=testlab,dc=local"
    AuthLDAPBindPassword "adminpass"

    Require valid-user

    # Alternative: nur Mitglieder von testgroup (posixGroup nutzt memberUid statt DN)
    # AuthLDAPGroupAttribute memberUid
    # AuthLDAPGroupAttributeIsDN off
    # Require ldap-group cn=testgroup,dc=testlab,dc=local
</Location>
