syntax = "proto3";

option java_multiple_files = true;
option java_package = "teamchat";
option java_outer_classname = "TeamChatProto";
option objc_class_prefix = "TCP";

package teamchat;


service TeamChat {
  rpc SendChatMsg (ChatMsg) returns (ChatMsg) {}
  rpc RegisterClient (RegMsg) returns (stream ServerEvent) {}
}

message ServerEvent {
  oneof event {
    RegAck regack = 1;
    RegMsg regmsg = 2;
    ChatMsg chat = 3;
  }
}

message ChatMsg {
  string name = 1;
  string msg = 2;
  int32 id = 3;
  // timestamp
}

message RegMsg {
  string name = 1;
}

message RegAck {
  bool ack = 1;
}
